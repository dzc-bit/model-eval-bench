<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 首屏前应用主题。没存过偏好时用系统偏好解析成显式 data-theme，
      // 这样 CSS 只需要一份深色定义（原先在 media query 里重复一份，改一处漏一处）
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) { /* 无痕模式等存储不可用：按浅色渲染 */ }
      })();
    </script>
    <meta name="referrer" content="no-referrer" />
    <!--
      模型评测台 — 零构建单页外壳。
      这里只有静态骨架：跳转链接、页头、导航挂载点、主内容容器、页脚。
      所有内容都交给 js/main.js 用 DOM API 渲染，不写死业务文案之外的任何东西。
    -->
    <title>模型评测台</title>
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/views.css" />
    <link rel="stylesheet" href="./css/views/task-library.css" />
    <link rel="stylesheet" href="./css/views/workspace.css" />
    <link rel="stylesheet" href="./css/views/models.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主内容</a>
    <div class="app-shell">
      <!-- 状态条宿主：全局错误条 / 连接状态条由 main.js 插到这里 -->
      <div id="status-host"></div>

      <header class="app-header">
        <!-- 品牌区：只放标识，不与导航抢注意力（Claude 侧栏同款分区） -->
        <div class="app-header__brand">
          <a class="brand" href="#/tasks">
            <!-- 徽标：三根刻度条立在托板上——"分档评测"的几何隐喻。
                 不套底板：图形本身就是标识，多一层色块只是噪音。 -->
            <svg class="brand__mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
              <path d="M3.5 20.5h17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <rect x="5" y="12.5" width="3.4" height="5" rx="1" fill="currentColor" />
              <rect x="10.3" y="8.5" width="3.4" height="9" rx="1" fill="currentColor" />
              <rect x="15.6" y="4.5" width="3.4" height="13" rx="1" fill="currentColor" />
            </svg>
            <span class="brand__name">模型评测台</span>
          </a>
        </div>
        <!-- 主操作区：全站唯一的「开始新评测」入口，与导航列表分开 -->
        <div class="app-header__action">
          <a class="side-cta" id="side-cta" href="#/tasks">
            <svg class="side-cta__glyph" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            </svg>
            <span>开始新评测</span>
          </a>
        </div>
        <!-- 导航区：唯一可滚动的部分，分组标题 + 链接 -->
        <nav class="app-nav" id="app-nav" aria-label="主导航"></nav>
        <!-- 底部区：固定贴底，与导航拉开距离 -->
        <div class="app-header__foot">
          <svg class="app-header__foot-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
            <rect x="5.5" y="10.5" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span class="app-header__foot-text">评测数据留在本机 · 模型调用由服务端代理</span>
        </div>
      </header>

      <main class="app-main" id="main-content" tabindex="-1">
        <!-- 这段只是「脚本还没跑起来」时的静态占位，main.js 挂载视图后会整块替换掉 -->
        <div id="app-root">
          <div class="view">
            <h1>模型评测台</h1>
            <p class="u-muted">
              正在载入界面…（如果长时间停在这里，说明前端脚本没有加载成功，请检查
              console\static\js 目录是否完整，然后刷新页面。）
            </p>
          </div>
        </div>
      </main>
    </div>

    <noscript>
      <div class="error-bar">
        <span class="error-bar__text">
          这个页面需要 JavaScript 才能运行。评测台是纯前端应用，请在浏览器设置里打开
          JavaScript 后刷新本页。
        </span>
      </div>
    </noscript>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
