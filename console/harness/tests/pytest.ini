[pytest]
# fixtures/ 里放的是"被测代码"（迷你仓库的测试、题包的隐藏测试），
# 不是本次要跑的用例，收集时整棵跳过。
norecursedirs = fixtures .* __pycache__ node_modules build dist

# 临时目录由 conftest.pytest_configure 钉死在 D:\new model test\.pytest-tmp。
# 命令行不再传 basetemp：相对路径是相对"当前工作目录"解析的，
# 从别的目录跑 pytest 就会写到系统盘去，违反"一切读写都在评测台内"。
addopts = -q -p no:cacheprovider
